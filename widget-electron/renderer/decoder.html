<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'">
  <title>LAS audio decoder</title>
</head>
<body>
<script>
  // Hidden window (main.js getDecoderWindow): compressed bytes in, mono
  // 16 kHz Float32 PCM out — the format Whisper's pipeline expects. Same
  // two steps as the widget mic's blobToMono16kPCM (renderer/widget.js).
  window.decoder.onRequest(async (id, bytes) => {
    try {
      const ctx = new AudioContext();
      let decoded;
      try {
        decoded = await ctx.decodeAudioData(bytes);
      } finally {
        ctx.close();
      }
      const rate = 16000;
      const offline = new OfflineAudioContext(1, Math.max(1, Math.ceil(decoded.duration * rate)), rate);
      const src = offline.createBufferSource();
      src.buffer = decoded;
      src.connect(offline.destination);
      src.start(0);
      const rendered = await offline.startRendering();
      window.decoder.reply(id, rendered.getChannelData(0).buffer, null);
    } catch (err) {
      window.decoder.reply(id, null, String(err && err.message ? err.message : err));
    }
  });
</script>
</body>
</html>
