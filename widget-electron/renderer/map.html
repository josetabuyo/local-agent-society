<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Map</title>
<!-- The same face as a widget (widget.css: the agent's color glass, the mini
     widgets of the society panel), laid out as a map (map.css). -->
<link rel="stylesheet" href="widget.css" />
<link rel="stylesheet" href="map.css" />
</head>
<body>
  <!-- The map window (docs/adr/0007): one 2D board like the society panel,
       Canvas/List at the top right, a ✕ on every mini widget. -->
  <div id="face" class="map-face">
    <header class="map-header">
      <div class="map-title">
        <span id="agentName" class="map-name">Agent</span>
      </div>
      <div class="header-actions">
        <button id="closeBtn" class="facebtn" type="button" title="Close the map">✕</button>
      </div>
    </header>
    <!-- Canvas/List sits inside the board, top right, over the panel (not in the header). -->
    <div class="map-stage">
      <main id="map" class="map-body"></main>
      <div class="segmented map-layout" id="layoutSeg" title="Layout">
        <button type="button" data-value="canvas">Canvas</button>
        <button type="button" data-value="list">List</button>
      </div>
    </div>
  </div>
  <script src="society-model.js"></script>
  <script src="society-views.js"></script>
  <script src="map-model.js"></script>
  <script src="map.js"></script>
</body>
</html>
