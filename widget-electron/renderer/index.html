<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Local Agent Society Widget</title>
<link rel="stylesheet" href="widget.css" />
</head>
<body>
  <div id="widget" class="widget">
    <div id="name" class="name">Agent</div>
    <div id="log" class="log"></div>

    <div class="buttonbar">
      <div class="bar-left">
        <button id="gear" class="facebtn" title="Settings">&#9881;</button>
        <button id="clear" class="facebtn" title="Send /clear to the linked terminal(s)">&#129529;</button>
      </div>
      <div class="bar-right">
        <button id="terminal" class="facebtn" title="Command palette">&#128241;</button>
        <button id="speaker" class="facebtn" title="Mute/unmute">&#128266;</button>
        <button id="mic" class="facebtn" title="Dictate (click to start/stop)">&#127908;</button>
        <button id="focus" class="facebtn" title="Focus terminal (right-click to link a TTY)">&#8982;</button>
      </div>
    </div>

    <div id="resizeHandle" class="resize-handle" title="Drag to resize"></div>
  </div>

  <div id="commands" class="settings hidden">
    <div id="commandsList" class="commands-list"></div>
    <div class="settings-row">
      <button id="commandsAdd">+ Add command</button>
      <button id="closeCommands">Done</button>
    </div>
  </div>

  <div id="commandEdit" class="settings hidden">
    <div class="settings-row">
      <label for="cmdLabel">Label</label>
      <input id="cmdLabel" type="text" placeholder="e.g. Resume" />
    </div>
    <div class="settings-row">
      <label for="cmdKind">Kind</label>
      <select id="cmdKind">
        <option value="openTerminal">Open terminal</option>
        <option value="sendMessage">Send message</option>
      </select>
    </div>
    <div class="settings-row" id="cmdCwdRow">
      <label for="cmdCwd">Directory</label>
      <input id="cmdCwd" type="text" placeholder="/path/to/project" />
    </div>
    <div class="settings-row" id="cmdCommandRow">
      <label for="cmdCommand">Shell command</label>
      <input id="cmdCommand" type="text" placeholder="claude --resume" />
    </div>
    <div class="settings-row" id="cmdTextRow">
      <label for="cmdText">Message text</label>
      <input id="cmdText" type="text" placeholder="/clear" />
    </div>
    <div class="settings-row">
      <button id="cmdSave">Save</button>
      <button id="cmdCancel">Cancel</button>
    </div>
  </div>

  <div id="ttyPicker" class="settings hidden">
    <div id="ttyList" class="commands-list"></div>
    <div class="settings-row">
      <button id="closeTtyPicker">Cancel</button>
    </div>
  </div>

  <div id="settings" class="settings hidden">
    <div class="settings-row">
      <label for="color">Color</label>
      <input id="color" type="color" />
    </div>
    <div class="settings-row">
      <label for="opacity">Opacity</label>
      <input id="opacity" type="range" min="0.2" max="1" step="0.02" />
    </div>
    <div class="settings-row">
      <label for="alwaysOnTop">Always on top</label>
      <input id="alwaysOnTop" type="checkbox" />
    </div>
    <div class="settings-row">
      <label for="mute">Mute</label>
      <input id="mute" type="checkbox" />
    </div>
    <div class="settings-row">
      <label for="expandWhenHidden">Expand when hidden</label>
      <input id="expandWhenHidden" type="checkbox" />
    </div>
    <div class="settings-row">
      <label for="micLanguage">Dictation language</label>
      <select id="micLanguage">
        <option value="es">Español</option>
        <option value="en">English</option>
        <option value="pt">Português</option>
        <option value="fr">Français</option>
        <option value="auto">Auto-detect</option>
      </select>
    </div>
    <button id="closeSettings">Done</button>
  </div>

  <script src="widget.js"></script>
</body>
</html>
