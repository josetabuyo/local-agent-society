<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Local Agent Society Widget</title>
<link rel="stylesheet" href="widget.css" />
</head>
<body>
  <div id="widget" class="widget">
    <div class="topbar">
      <div id="name" class="name">Agent</div>
      <button id="door" class="facebtn door-corner" title="Deactivate (close widget, mark inactive)">&#128682;</button>
    </div>
    <div id="log" class="log"></div>

    <div class="buttonbar">
      <div class="bar-left">
        <button id="gear" class="facebtn" title="Settings">&#9881;</button>
        <button id="clear" class="facebtn" title="Send /clear to the linked terminal(s)">&#129529;</button>
      </div>
      <div class="bar-right">
        <button id="open" class="facebtn" title="Open: terminal window / folder at this agent's path (click = default, hold or right-click = choose and reorder)">&#10697;</button>
        <button id="speaker" class="facebtn" title="Mute/unmute">&#128266;</button>
        <button id="mic" class="facebtn" title="Dictate (click to start/stop, double-click to test mic)">&#127908;</button>
        <button id="focus" class="facebtn" title="Focus terminal (right-click to link a TTY)">&#8982;</button>
      </div>
    </div>

    <!-- Inline, NOT a full-screen overlay (unlike #ttyPicker below) —
         settings mode keeps the real name/log visible above it. See
         widget.js's setSettingsOpen. -->
    <div id="settings" class="settings settings-inline hidden">
      <div class="settings-row">
        <label for="color">Color</label>
        <input id="color" type="color" />
      </div>
      <div class="settings-row">
        <label for="opacity">Opacity</label>
        <input id="opacity" type="range" min="0.2" max="1" step="0.02" />
      </div>
      <div class="settings-row">
        <label for="alwaysOnTop">Always on top</label>
        <input id="alwaysOnTop" type="checkbox" />
      </div>
      <div class="settings-row">
        <label for="mute">Mute</label>
        <input id="mute" type="checkbox" />
      </div>
      <div class="settings-row">
        <label for="expandWhenHidden">Expand when hidden</label>
        <input id="expandWhenHidden" type="checkbox" />
      </div>
      <div class="settings-row">
        <label for="wakeEnabled">Wake up via vortexia</label>
        <input id="wakeEnabled" type="checkbox" />
      </div>
      <div class="settings-row">
        <label for="micLanguage">Dictation language</label>
        <select id="micLanguage">
          <option value="es">Español</option>
          <option value="en">English</option>
          <option value="pt">Português</option>
          <option value="fr">Français</option>
          <option value="auto">Auto-detect</option>
        </select>
      </div>
    </div>

    <!-- "Open" button press-and-hold menu: both actions in order, the top
         one is what a plain click runs. Small inline popover (fixed above
         the button bar), not a full-window overlay — no expand needed. -->
    <div id="openMenu" class="open-menu hidden"></div>

    <div id="resizeHandle" class="resize-handle" title="Drag to resize"></div>
  </div>

  <div id="ttyPicker" class="settings hidden">
    <div id="ttyList" class="commands-list"></div>
    <div class="settings-row">
      <button id="closeTtyPicker">Cancel</button>
    </div>
  </div>

  <script src="widget.js"></script>
</body>
</html>
